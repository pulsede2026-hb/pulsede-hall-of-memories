<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PulseDE Hall of Memories - Player links</title>
<style>
body {
  margin:0;
  background:#0d0d0d;
  color:#fff;
  font-family:Arial,sans-serif;
}
.wrap {
  max-width:760px;
  height:630px;
  margin:auto;
  padding:16px 16px 18px;
  text-align:center;
  background:linear-gradient(180deg,#090909,#180a22);
  border:2px solid #d6a84f;
  border-radius:22px;
  box-sizing:border-box;
  overflow:hidden;
  position:relative;
  box-shadow:
    0 0 18px rgba(214,168,79,0.38),
    inset 0 0 12px rgba(255,220,140,0.14),
    0 8px 24px rgba(0,0,0,0.55);
}
.small {
  font-size:22px;
  color:#ffd76a;
  font-weight:bold;
}
.big {
  font-size:40px;
  color:#ffd76a;
  font-weight:bold;
  line-height:1;
}
.sub {
  color:#c998ff;
  font-size:18px;
  margin:4px 0 12px;
}
.cover img {
  width:min(260px,68vw);
  border-radius:18px;
  box-shadow:0 0 22px rgba(255,180,60,.25);
}
.song {
  font-size:22px;
  margin-top:10px;
}
.song.waiting {
  color:#ffd76a;
  font-weight:bold;
  min-height:28px;
}
.artist {
  font-size:16px;
  color:#ddd;
  margin:3px 0 10px;
}
.player {
  width:70%;
  max-width:560px;
  margin:auto;
}
.player audio {
  width:100%;
}
.next {
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:12px;
}
.next img {
  width:62px;
  border-radius:10px;
  opacity:.9;
  cursor:pointer;
}
.infoRow {
  position:absolute;
  left:16px;
  bottom:12px;
  display:flex;
  justify-content:flex-start;
  align-items:flex-start;
  gap:12px;
  max-width:700px;
}
.note {
  font-size:12px;
  text-align:left;
  max-width:320px;
  color:#ccc;
}
.rightHint {
  font-size:13px;
  color:#c998ff;
  text-align:right;
}
@media(max-width:700px){
  .wrap{height:630px; padding-bottom:10px}
  .big{font-size:34px}
  .cover img{width:min(220px,68vw)}
  .song{font-size:21px}
  .player{width:96%; max-width:none;}
  .next{margin-top:8px}
  .infoRow{left:12px; bottom:10px;}
  .note{text-align:left; font-size:11px;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="small">PulseDE</div>
  <div class="big">Hall of Memories</div>
  <div class="sub">🎵 Music Jukebox</div>

  <div class="playerBlock">
    <div class="cover">

    </div>

    <div class="song waiting" id="songTitle">🎵 Bitte Erlebnis-Ordner wählen</div>
    <div class="artist">Harry Bolero</div>

    <div class="player">
      <audio controls preload="none" id="audioPlayer" controlsList="nodownload noplaybackrate" oncontextmenu="return false;">
        <source src="" type="audio/mpeg">
        Dein Browser unterstützt kein Audio.
      </audio>
    </div>

    <div class="next" id="nextSongs"></div>

    <div class="infoRow">
      <div class="note">
        * = Song berührt die Themen 
        Behinderung, Einschränkung oder
        besondere Lebenserfahrung

</div>

let currentSong = null;
let hmFolderQueue = null;
let hmFolderQueuePosition = 0;
let hasActiveSong = false;

const player = document.getElementById("audioPlayer");
const source = player.querySelector("source");
const cover = document.getElementById("mainCover");
const title = document.getElementById("songTitle");
const nextSongs = document.getElementById("nextSongs");

function songNameFromFile(songFile) {
  return songFile.replace(".mp3", "").replaceAll("_", " ");
}

function currentSongMessage() {
  if (!hasActiveSong || currentSong === null || !playlist[currentSong]) {
    return {
      type: "HM_CURRENT_SONG",
      songFile: "",
      txtFile: "",
      title: "🎵 Bitte Erlebnis-Ordner wählen",
      time: Date.now()
    };
  }

  const songFile = playlist[currentSong];
  const txtFile = songFile.replace(".mp3", ".txt");

  return {
    type: "HM_CURRENT_SONG",
    songFile: songFile,
    txtFile: txtFile,
    title: songNameFromFile(songFile),
    time: Date.now()
  };
}

function sendCurrentSongToRight() {
  const message = currentSongMessage();

  try {
    localStorage.setItem("hmCurrentSong", JSON.stringify(message));
  } catch (error) {}

  try {
    window.parent.postMessage(message, "*");
  } catch (error) {}
}


function syncFolderQueue(newQueue){
  const list = Array.isArray(newQueue) ? newQueue.map(Number).filter(Number.isInteger) : [];

  if (list.length === 0) {
    hmFolderQueue = [];
    hmFolderQueuePosition = 0;
    player.pause();
    return;
  }

  hmFolderQueue = list;

  const currentPosition = hmFolderQueue.indexOf(currentSong);

  if (currentPosition >= 0) {
    hmFolderQueuePosition = currentPosition;
    return;
  }

  hmFolderQueuePosition = 0;
  changeSong(hmFolderQueue[0]);
}

window.addEventListener("message", function(event) {
  const data = event.data;
  if (!data || !data.type) return;

  if (data.type === "HM_REQUEST_CURRENT") {
    sendCurrentSongToRight();
    return;
  }

  if (data.type === "HM_SELECT_SONG") {
    hmFolderQueue = null;
    hmFolderQueuePosition = 0;
    changeSong(Number(data.songIndex));
    return;
  }

  if (data.type === "HM_PLAY_FOLDER") {
    const list = Array.isArray(data.songIndexes) ? data.songIndexes.map(Number).filter(Number.isInteger) : [];
    if (list.length === 0) return;

    hmFolderQueue = list;
    hmFolderQueuePosition = 0;
    changeSong(hmFolderQueue[0]);
    return;
  }

  if (data.type === "HM_UPDATE_FOLDER_QUEUE") {
    syncFolderQueue(data.songIndexes);
    return;
  }

  if (data.type === "HM_STOP_AND_CLOSE") {
    hmFolderQueue = null;
    hmFolderQueuePosition = 0;
    hasActiveSong = false;
    currentSong = null;
    player.pause();
    player.currentTime = 0;
    source.src = "";
    title.innerText = "🎵 Bitte Erlebnis-Ordner wählen";
    title.classList.add("waiting");
    nextSongs.innerHTML = "";
    player.load();
    sendCurrentSongToRight();
    return;
  }
});

window.addEventListener("DOMContentLoaded", function() {
  sendCurrentSongToRight();
});

function updateNextCovers() {
  let html = "";
  let shown = 0;
  let i = currentSong + 1;

  while (shown < 3 && i < playlist.length) {
    if (playlist[i] && covers[i]) {
      html += `<img src="${covers[i]}" onclick="changeSong(${i})" alt="Nächster Song">`;
      shown++;
    }
    i++;
  }

  nextSongs.innerHTML = html;
}

function changeSong(index) {
  index = Number(index);
  if (!Number.isInteger(index) || index < 0 || index >= playlist.length) return;

  hasActiveSong = true;
  currentSong = index;
  source.src = playlist[currentSong];
  cover.src = playlist[currentSong].replace(".mp3", ".jpg");
  title.innerText = songNameFromFile(playlist[currentSong]);
  title.classList.remove("waiting");
  updateNextCovers();
  sendCurrentSongToRight();

  player.load();
  player.play();
}


player.addEventListener("ended", function () {
  if (hmFolderQueue && hmFolderQueue.length > 0) {
    hmFolderQueuePosition++;

    if (hmFolderQueuePosition < hmFolderQueue.length) {
      changeSong(hmFolderQueue[hmFolderQueuePosition]);
      return;
    }

    hmFolderQueue = null;
    hmFolderQueuePosition = 0;
    return;
  }

  /* Einzelne Songs laufen nicht automatisch in die komplette 01-58-Playlist weiter. */
  hmFolderQueue = null;
  hmFolderQueuePosition = 0;
  player.pause();
});

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PulseDE HOME Test – Player Songtext Explorer</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
}

.home-wrap{
    max-width:1200px;
    margin:0 auto;
    padding:20px;
}

.top-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:25px;
}

iframe{
    width:100%;
    border:none;
    border-radius:12px;
    background:#111;
}

.player-frame,
.text-frame{
    height:630px;
}

.info{
    font-size:15px;
    color:#cccccc;
    margin:20px 0;
}

.explorer-frame{
    height:700px;
}

@media(max-width:800px){
    .top-grid{
        grid-template-columns:1fr;
    }

    .player-frame,
    .text-frame{
        height:630px;
    }

    .explorer-frame{
        height:700px;
    }
}
</style>
</head>

<body>

<div class="home-wrap">

    <div class="top-grid">

        <iframe
            id="hmPlayerFrame"
            class="player-frame"
            src="https://pulsede2026-hb.github.io/pulsede-hall-of-memories/PulseDE_HM_PLAYER_LINKS_A1_V4.html">
        </iframe>

        <iframe
            id="hmTextFrame"
            class="text-frame"
            src="https://pulsede2026-hb.github.io/pulsede-hall-of-memories/PulseDE_HM_SONGTEXT_RECHTS_A1_V4.html">
        </iframe>

    </div>

    <div class="info">
        Wähle Deine Musik aus den Erlebnis-Ordnern der Hall of Memories.
    </div>

    <iframe
        id="hmExplorerFrame"
        class="explorer-frame"
        src="https://pulsede2026-hb.github.io/pulsede-hall-of-memories/PulseDE_HM_EXPLORER_TEST_V1.html">
    </iframe>

</div>

<script>
const hmPlayerFrame = document.getElementById("hmPlayerFrame");
const hmTextFrame = document.getElementById("hmTextFrame");

function sendToPlayer(message){
    if (!hmPlayerFrame || !hmPlayerFrame.contentWindow) return;
    hmPlayerFrame.contentWindow.postMessage(message, "*");
}

function sendToText(message){
    if (!hmTextFrame || !hmTextFrame.contentWindow) return;
    hmTextFrame.contentWindow.postMessage(message, "*");
}

window.addEventListener("message", function(event){
    const data = event.data;
    if (!data || !data.type) return;

    if (
        data.type === "HM_SELECT_SONG" ||
        data.type === "HM_PLAY_FOLDER" ||
        data.type === "HM_STOP_AND_CLOSE" ||
        data.type === "HM_UPDATE_FOLDER_QUEUE" ||
        data.type === "HM_REQUEST_CURRENT"
    ){
        sendToPlayer(data);
    }

    if (data.type === "HM_CURRENT_SONG"){
        sendToText(data);
    }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PulseDE HM Explorer Test V2.1</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(260px, 520px));
    gap:22px;
    justify-content:center;
}

.folder{
    max-width:520px;
    margin:auto;
}

.folder img{
    width:100%;
    border-radius:12px;
    cursor:pointer;
}

.songlist{
    display:none;
    margin-top:15px;
    background:#222;
    padding:15px;
    border-radius:12px;
}

button{
    padding:10px 15px;
    margin:5px;
    cursor:pointer;
}

.songButton{
    display:block;
    width:90%;
    max-width:430px;
    margin:8px auto;
    background:#333;
    color:white;
    border:1px solid #666;
    border-radius:10px;
    font-size:15px;
    text-align:left;
}

.songButton:hover{
    background:#444;
}

.hidden{
    display:none;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<h1>PulseDE Hall of Memories</h1>
<p>Wähle einen Erlebnis-Ordner</p>

<p style="font-size:12px; color:#bbbbbb; margin-bottom:20px;">
* = Song berührt die Themen Behinderung, Einschränkung oder Lebenserfahrung.
</p>

<div class="grid">

<div class="folder" id="folder01">
<img src="HM_01_Gefuehl.jpg" onclick="openFolder('folder01','songs01')" alt="01 Gefühl">
<div id="songs01" class="songlist">
<h2>❤️ 01 Gefühl</h2>
<button onclick="playFolder([0,3,4,5])">▶️ Gesamten Ordner abspielen</button>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
<hr>
<button class="songButton" onclick="selectSong(0)">☐ 01 Nordlichter</button>
<button class="songButton" onclick="selectSong(3)">☐ 04 Mein Weg zurück zu dir</button>
<button class="songButton" onclick="selectSong(4)">☐ 05 Bleib bei mir</button>
<button class="songButton" onclick="selectSong(5)">☐ 06 Abschied am Telefon</button>
<hr>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
</div>
</div>

<div class="folder" id="folder02">
<img src="HM_02_Nachdenken.jpg" onclick="openFolder('folder02','songs02')" alt="02 Nachdenken">
<div id="songs02" class="songlist">
<h2>🌙 02 Nachdenken</h2>
<button onclick="playFolder([1])">▶️ Gesamten Ordner abspielen</button>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
<hr>
<button class="songButton" onclick="selectSong(1)">☐ Test-Song Nachdenken</button>
<hr>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
</div>
</div>

<div class="folder" id="folder03">
<img src="HM_03_Hoffnung.jpg" onclick="openFolder('folder03','songs03')" alt="03 Hoffnung">
<div id="songs03" class="songlist">
<h2>🍀 03 Hoffnung</h2>
<button onclick="playFolder([2])">▶️ Gesamten Ordner abspielen</button>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
<hr>
<button class="songButton" onclick="selectSong(2)">☐ Test-Song Hoffnung</button>
<hr>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
</div>
</div>

<div class="folder" id="folder04">
<img src="HM_04_Menschlichkeit.jpg" onclick="openFolder('folder04','songs04')" alt="04 Menschlichkeit">
<div id="songs04" class="songlist">
<h2>🤝 04 Menschlichkeit</h2>
<button onclick="playFolder([6])">▶️ Gesamten Ordner abspielen</button>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
<hr>
<button class="songButton" onclick="selectSong(6)">☐ Test-Song Menschlichkeit</button>
<hr>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
</div>
</div>

<img src="HM_05_Alltag_Leben.jpg" onclick="openFolder('folder05','songs05')" alt="05 Alltag & Leben">
<div id="songs05" class="songlist">

<button onclick="playFolder([7])">▶️ Gesamten Ordner abspielen</button>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>

<button onclick="playFolder([8])">▶️ Gesamten Ordner abspielen</button>

<hr>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
</div>
</div>

</div>

<script>
function openFolder(folderId, songsId){
    const folders = document.querySelectorAll('.folder');
    folders.forEach(folder => {
        if(folder.id !== folderId){
            folder.classList.add('hidden');
        }
    });

    document.getElementById(songsId).style.display = "block";
}

function closeFolder(){
    const folders = document.querySelectorAll('.folder');
    const songlists = document.querySelectorAll('.songlist');

    folders.forEach(folder => folder.classList.remove('hidden'));
    songlists.forEach(list => list.style.display = "none");

    window.parent.postMessage({
        type:"HM_STOP_AND_CLOSE",
        time:Date.now()
    }, "*");
}

function selectSong(index){
    window.parent.postMessage({
        type:"HM_SELECT_SONG",
        songIndex:index,
        time:Date.now()
    }, "*");
}

function playFolder(indexList){
    window.parent.postMessage({
        type:"HM_PLAY_FOLDER",
        songIndexes:indexList,
        time:Date.now()
    }, "*");
}
</script>

</body>
</html>

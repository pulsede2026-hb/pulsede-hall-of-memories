<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PulseDE HM Explorer Test V2.3</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(260px, 520px));
    gap:22px;
    justify-content:center;
}

.folder{
    max-width:520px;
    margin:auto;
}

.folder img{
    width:100%;
    border-radius:12px;
    cursor:pointer;
}

.songlist{
    display:none;
    margin-top:15px;
    background:#222;
    padding:15px;
    border-radius:12px;
}

button{
    padding:10px 15px;
    margin:5px;
    cursor:pointer;
}

.songChoice{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:10px;
    width:90%;
    max-width:420px;
    margin:8px auto;
    padding:9px 12px;
    background:#333;
    color:white;
    border:1px solid #666;
    border-radius:10px;
    font-size:15px;
    cursor:pointer;
    box-sizing:border-box;
}

.songChoice:hover{
    background:#444;
}

.songChoice input{
    transform:scale(1.15);
    cursor:pointer;
}

.hidden{
    display:none;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<p style="font-size:12px; color:#bbbbbb; margin-bottom:20px;">
* = Song berührt die Themen Behinderung, Einschränkung oder Lebenserfahrung.
</p>

<div class="grid">

<div class="folder" id="folder01">
<img src="HM_01_Gefuehl.jpg" onclick="openFolder('folder01','songs01')">
<div id="songs01" class="songlist">
<h2>❤️ 01 Gefühl</h2>
<button onclick="playWholeFolder('songs01')">▶️ Gesamten Ordner abspielen</button>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
<hr>
<label class="songChoice"><input type="checkbox" data-song-index="0" onchange="updateFolderSelection('songs01')"> 01 Nordlichter</label>
<label class="songChoice"><input type="checkbox" data-song-index="3" onchange="updateFolderSelection('songs01')"> 04 Mein Weg zurück zu dir</label>
<label class="songChoice"><input type="checkbox" data-song-index="4" onchange="updateFolderSelection('songs01')"> 05 Bleib bei mir</label>
<label class="songChoice"><input type="checkbox" data-song-index="5" onchange="updateFolderSelection('songs01')"> 06 Abschied am Telefon</label>
<hr>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
</div>
</div>

<div class="folder" id="folder02">
<img src="HM_02_Nachdenken.jpg" onclick="openFolder('folder02','songs02')">
<div id="songs02" class="songlist">
<h2>🌙 02 Nachdenken</h2>
<button onclick="playWholeFolder('songs02')">▶️ Gesamten Ordner abspielen</button>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
<hr>
<label class="songChoice"><input type="checkbox" data-song-index="1" onchange="updateFolderSelection('songs02')"> Test-Song Nachdenken</label>
<hr>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
</div>
</div>

<div class="folder" id="folder03">
<img src="HM_03_Hoffnung.jpg" onclick="openFolder('folder03','songs03')">
<div id="songs03" class="songlist">
<h2>🍀 03 Hoffnung</h2>
<button onclick="playWholeFolder('songs03')">▶️ Gesamten Ordner abspielen</button>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
<hr>
<label class="songChoice"><input type="checkbox" data-song-index="2" onchange="updateFolderSelection('songs03')"> Test-Song Hoffnung</label>
<hr>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
</div>
</div>

<div class="folder" id="folder04">
<img src="HM_04_Menschlichkeit.jpg" onclick="openFolder('folder04','songs04')">
<div id="songs04" class="songlist">
<h2>🤝 04 Menschlichkeit</h2>
<button onclick="playWholeFolder('songs04')">▶️ Gesamten Ordner abspielen</button>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
<hr>
<label class="songChoice"><input type="checkbox" data-song-index="6" onchange="updateFolderSelection('songs04')"> Test-Song Menschlichkeit</label>
<hr>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
</div>
</div>

<div class="folder" id="folder05">
<img src="HM_05_Alltag_Leben.jpg" onclick="openFolder('folder05','songs05')">
<div id="songs05" class="songlist">
<h2>⚙️ 05 Alltag & Leben</h2>
<button onclick="playWholeFolder('songs05')">▶️ Gesamten Ordner abspielen</button>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
<hr>
<label class="songChoice"><input type="checkbox" data-song-index="7" onchange="updateFolderSelection('songs05')"> Test-Song Alltag & Leben</label>
<hr>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
</div>
</div>

<div class="folder" id="folder06">
<img src="HM_06_Entscheidung.jpg" onclick="openFolder('folder06','songs06')">
<div id="songs06" class="songlist">
<h2>⚖️ 06 Entscheidung</h2>
<button onclick="playWholeFolder('songs06')">▶️ Gesamten Ordner abspielen</button>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
<hr>
<label class="songChoice"><input type="checkbox" data-song-index="8" onchange="updateFolderSelection('songs06')"> Test-Song Entscheidung</label>
<hr>
<button onclick="closeFolder()">⏹ Wiedergabe beenden & Ordner schließen</button>
</div>
</div>

</div>

<script>
let activeSongListId = null;
let folderPlaybackStarted = false;

function openFolder(folderId, songsId){
    const folders = document.querySelectorAll('.folder');
    folders.forEach(folder => {
        if(folder.id !== folderId){
            folder.classList.add('hidden');
        }
    });

    activeSongListId = songsId;
    folderPlaybackStarted = false;
    document.getElementById(songsId).style.display = "block";
}

function clearAllSelections(){
    const checkboxes = document.querySelectorAll('input[type="checkbox"][data-song-index]');
    checkboxes.forEach(box => box.checked = false);
}

function closeFolder(){
    const folders = document.querySelectorAll('.folder');
    const songlists = document.querySelectorAll('.songlist');

    clearAllSelections();
    activeSongListId = null;
    folderPlaybackStarted = false;

    folders.forEach(folder => folder.classList.remove('hidden'));
    songlists.forEach(list => list.style.display = "none");

    window.parent.postMessage({
        type:"HM_STOP_AND_CLOSE"
    }, "*");
}

function getSelectedIndexes(songListId){
    const songList = document.getElementById(songListId);
    const checkedBoxes = songList.querySelectorAll('input[type="checkbox"][data-song-index]:checked');
    return Array.from(checkedBoxes).map(box => Number(box.dataset.songIndex));
}

function playWholeFolder(songListId){
    const songList = document.getElementById(songListId);
    const boxes = songList.querySelectorAll('input[type="checkbox"][data-song-index]');

    boxes.forEach(box => box.checked = true);

    activeSongListId = songListId;
    folderPlaybackStarted = true;

    const indexes = getSelectedIndexes(songListId);

    window.parent.postMessage({
        type:"HM_PLAY_FOLDER",
        songIndexes:indexes
    }, "*");
}

function updateFolderSelection(songListId){
    const indexes = getSelectedIndexes(songListId);

    /* Wichtig: Checkboxen allein starten NICHTS.
       Erst wenn der Ordner bereits gestartet wurde, wird die laufende Warteschlange aktualisiert. */
    if (!folderPlaybackStarted || activeSongListId !== songListId) return;

    window.parent.postMessage({
        type:"HM_UPDATE_FOLDER_QUEUE",
        songIndexes:indexes
    }, "*");
}
</script>

</body>
</html>
